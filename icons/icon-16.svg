<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Almanac's mark: the analemma, the figure-eight the sun traces across
       the sky over a year (small summer loop on top, larger winter loop
       below), narrowed to 72% width and tilted 18 degrees. Solid line: at 16px the dotted version's dots turn to specks, so this one is drawn for that size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb46b"/>
      <stop offset="1" stop-color="#f06a4a"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <g transform="translate(64 62) rotate(18) scale(0.95)">
    <path d="M0 -44 C13.7 -44 13.7 -20 0 -12 C-22.3 0 -22.3 40 0 40 C22.3 40 22.3 0 0 -12 C-13.7 -20 -13.7 -44 0 -44 Z" fill="none" stroke="#fff" stroke-opacity="0.92" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
