<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Almanac</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon48.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
    <link rel="stylesheet" href="panels.css" />
    <style>
      html,
      body {
        box-sizing: border-box;
        font-family: Helvetica, sans-serif;
        font-size: var(--font-size);
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* The gear fills its frosted backing (see .top-controls in panels.css)
         so its hover highlight runs flush to the backing's edges */
      .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.75rem;
        height: 2.75rem;
        padding: 0;
        border: 0;
        border-radius: inherit;
        background: none;
        color: var(--text);
        font-size: 1.5rem;
        opacity: 0.85;
        cursor: pointer;
        transition:
          opacity 0.3s,
          background-color 0.3s;

        /* An SVG rather than the ⚙ character: the glyph sits off-center in
           its line box, so spinning it made it wobble */
        & svg {
          width: 1em;
          height: 1em;
          transition: transform 0.3s;
        }
      }

      .menu-toggle:hover,
      .menu-toggle[aria-expanded="true"] {
        opacity: 1;
        background-color: var(--text-hover);

        & svg {
          transform: rotate(90deg);
        }
      }

      /* Items run edge to edge, so their hover highlight is flush with the
         menu's sides too */
      .menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        min-width: 11rem;
        max-height: calc(100vh - 6rem);
        overflow: auto;
        padding: 0;
        border-radius: min(var(--panel-radius), 1rem);
        /* a backdrop blur can't see past the gear's frosted backing, so the
           menu stacks the translucent panel color to stay near-opaque */
        background:
          linear-gradient(var(--panel-background), var(--panel-background)),
          linear-gradient(var(--panel-background), var(--panel-background)),
          var(--panel-background);
        box-shadow: 0 0.5rem 1.5rem #0004;
      }

      .menu[hidden] {
        display: none;
      }

      .menu-item {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        width: 100%;
        padding: 0.65rem 1.1rem;
        border: 0;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.2s;

        /* a check column, so set names line up whether or not they're current */
        &[role="menuitemradio"]::before {
          content: "";
          width: 0.9em;
          text-align: center;
        }

        &[aria-checked="true"]::before {
          content: "\2713";
        }
      }

      /* Settings keeps the same indent as the set names above it */
      .menu:has([role="menuitemradio"]) .menu-item[role="menuitem"]::before {
        content: "";
        width: 0.9em;
      }

      .menu-item:hover,
      .menu-item:focus-visible {
        background-color: var(--text-hover);
        outline: none;
      }

      .menu-divider {
        height: 1px;
        margin: 0;
        background: color-mix(in srgb, var(--text) 25%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="top-controls">
      <button
        id="menu-toggle"
        class="menu-toggle"
        title="Link sets and settings"
        aria-haspopup="menu"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <!-- teeth: a thick dashed ring, 8 dashes around r=8 (circumference 16π) -->
          <circle cx="12" cy="12" r="8" stroke-width="4" stroke-dasharray="3.1416 3.1416" />
          <circle cx="12" cy="12" r="5.5" stroke-width="3" />
        </svg>
      </button>
      <div id="menu" class="menu" role="menu" hidden></div>
    </div>
    <!-- Only a box in the Center layout, which puts the clock and links in
         one panel; see .stack in panels.css -->
    <div class="stack">
      <section id="link-groups" class="link-groups panel"></section>
      <section id="clock" class="clock panel"><span></span></section>
    </div>
    <script src="storage.js"></script>
    <script src="render.js"></script>
    <script src="new-tab.js"></script>
  </body>
</html>
