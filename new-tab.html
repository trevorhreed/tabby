<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tabby</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon48.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
    <link rel="stylesheet" href="panels.css" />
    <style>
      html,
      body {
        box-sizing: border-box;
        font-family: Helvetica, sans-serif;
        font-size: var(--font-size);
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Controls sit straight on the photo, with no strip behind them; a soft
         shadow keeps the glyphs legible over busy photos. panels.css places
         them per layout. */
      .top-controls {
        --switcher-pad-x: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        filter: drop-shadow(0 1px 2px #0005);
      }

      .settings-link,
      .set-switcher-toggle {
        color: var(--text);
        opacity: 0.8;
        cursor: pointer;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        height: 2.5rem;
        border-radius: 0.5rem;
        transition:
          opacity 0.3s,
          background-color 0.3s;
        text-decoration: none;
      }

      .settings-link:hover,
      .set-switcher-toggle:hover {
        opacity: 1;
        background-color: var(--text-hover);
      }

      .settings-link {
        justify-content: center;
        width: 2.5rem;
        /* pushed right in a footer row, whether or not the switcher shows */
        margin-left: auto;
        font-size: 1.5rem;

        /* An SVG rather than the ⚙ character: the glyph sits off-center in
           its line box, so spinning it made it wobble */
        & svg {
          width: 1em;
          height: 1em;
          transition: transform 0.3s;
        }
      }

      .settings-link:hover svg {
        transform: rotate(90deg);
      }

      .set-switcher {
        position: relative;
        display: flex;
      }

      .set-switcher-toggle {
        padding: 0 var(--switcher-pad-x);
        font-size: 1rem;

        /* says "this opens a menu" */
        &::after {
          content: "\25BE";
          margin-left: 0.35em;
          font-size: 0.8em;
          opacity: 0.7;
        }
      }

      .set-switcher-menu {
        position: absolute;
        top: calc(100% + 0.75rem);
        right: 0;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        min-width: 8rem;
        /* cap at the viewport, minus the controls row above it */
        max-height: calc(100vh - 6rem);
      }

      .set-switcher-menu[hidden] {
        display: none;
      }

      .set-switcher-item {
        color: var(--text);
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        transition: background-color 0.3s;
      }

      .set-switcher-item:hover {
        background-color: var(--text-hover);
      }

      .set-switcher-item.current {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!-- Only a box in the Center layout, which puts everything in one panel;
         see .stack in panels.css -->
    <div class="stack">
      <section id="link-groups" class="link-groups panel"></section>
      <section id="clock" class="clock panel"><span></span></section>
      <div class="top-controls">
        <div id="set-switcher" class="set-switcher">
          <a id="set-switcher-toggle" class="set-switcher-toggle" title="Link set"></a>
          <div id="set-switcher-menu" class="set-switcher-menu panel" hidden></div>
        </div>
        <a id="settings-link" class="settings-link" title="Options"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <!-- teeth: a thick dashed ring, 8 dashes around r=8 (circumference 16π) -->
            <circle cx="12" cy="12" r="8" stroke-width="4" stroke-dasharray="3.1416 3.1416" />
            <circle cx="12" cy="12" r="5.5" stroke-width="3" /></svg
        ></a>
      </div>
    </div>
    <script src="storage.js"></script>
    <script src="render.js"></script>
    <script src="new-tab.js"></script>
  </body>
</html>
