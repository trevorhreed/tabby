<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tabby</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon48.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
    <link rel="stylesheet" href="panels.css" />
    <style>
      html,
      body {
        box-sizing: border-box;
        font-family: Helvetica, sans-serif;
        font-size: var(--font-size);
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Shared panel strip keeps the controls legible over busy photos */
      .top-controls {
        position: fixed;
        top: 1rem;
        right: 1rem;
        display: flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0.25rem;
        border-radius: 0.75rem;
        /* the panel class's overflow: auto would clip the dropdown menu */
        overflow: visible;
      }

      .settings-link {
        color: var(--text);
        opacity: 0.8;
        cursor: pointer;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 2.5rem;
        width: 2.5rem;
        border-radius: 0.5rem;
        transition: opacity 0.3s;
        font-size: 1.5rem;
        text-decoration: none;

        /* An SVG rather than the ⚙ character: the glyph sits off-center in
           its line box, so spinning it made it wobble */
        & svg {
          width: 1em;
          height: 1em;
          transition: transform 0.3s;
        }
      }

      .settings-link:hover {
        opacity: 1;

        & svg {
          transform: rotate(90deg);
        }
      }

      .set-switcher {
        position: relative;
        display: flex;
      }

      .set-switcher-toggle {
        color: var(--text);
        opacity: 0.8;
        cursor: pointer;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        /* matches the gear button's height so the pair sits level */
        height: 2.5rem;
        padding: 0 1rem;
        border-radius: 0.5rem;
        transition: opacity 0.3s;
        font-size: 1rem;
        text-decoration: none;
      }

      .set-switcher-toggle:hover {
        opacity: 1;
      }

      .set-switcher-menu {
        position: absolute;
        top: calc(100% + 0.75rem);
        right: 0;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        min-width: 8rem;
        /* the panel class's 100% cap would resolve against the 2.5rem
           switcher row; cap at the viewport instead, minus the strip above */
        max-height: calc(100vh - 6rem);
      }

      .set-switcher-menu[hidden] {
        display: none;
      }

      .set-switcher-item {
        color: var(--text);
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        transition: background-color 0.3s;
      }

      .set-switcher-item:hover {
        background-color: var(--text-hover);
      }

      .set-switcher-item.current {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="top-controls panel">
      <div id="set-switcher" class="set-switcher">
        <a id="set-switcher-toggle" class="set-switcher-toggle" title="Link set"></a>
        <div id="set-switcher-menu" class="set-switcher-menu panel" hidden></div>
      </div>
      <a id="settings-link" class="settings-link" title="Options"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <!-- teeth: a thick dashed ring, 8 dashes around r=8 (circumference 16π) -->
          <circle cx="12" cy="12" r="8" stroke-width="4" stroke-dasharray="3.1416 3.1416" />
          <circle cx="12" cy="12" r="5.5" stroke-width="3" /></svg
      ></a>
    </div>
    <section id="link-groups" class="link-groups panel"></section>
    <section id="clock" class="clock panel"><span></span></section>
    <script src="storage.js"></script>
    <script src="render.js"></script>
    <script src="new-tab.js"></script>
  </body>
</html>
