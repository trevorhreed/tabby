<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="440" height="280" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="400" cy="40" r="80" fill="#4338ca" opacity="0.3"/>
  <circle cx="40" cy="240" r="60" fill="#4338ca" opacity="0.2"/>
  
  <!-- Icon - scaled up -->
  <g transform="translate(60, 90) scale(0.8)">
    <!-- Cat ears -->
    <path d="M24 48 L36 20 L48 44" fill="url(#tabGrad)"/>
    <path d="M80 44 L92 20 L104 48" fill="url(#tabGrad)"/>
    
    <!-- Browser tab shape -->
    <path d="M20 48 L20 100 Q20 108 28 108 L100 108 Q108 108 108 100 L108 48 Q108 40 100 40 L28 40 Q20 40 20 48" fill="url(#tabGrad)"/>
    
    <!-- Inner ear detail -->
    <path d="M32 44 L36 28 L40 42" fill="#c4b5fd"/>
    <path d="M88 42 L92 28 L96 44" fill="#c4b5fd"/>
    
    <!-- Whiskers - left -->
    <line x1="8" y1="68" x2="28" y2="72" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="80" x2="26" y2="80" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="92" x2="28" y2="88" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Whiskers - right -->
    <line x1="100" y1="72" x2="120" y2="68" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="80" x2="122" y2="80" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="88" x2="120" y2="92" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="180" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">Tabby</text>
  <text x="180" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#c4b5fd">Beautiful New Tab Page</text>
  
  <!-- Feature highlights -->
  <text x="180" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a5b4fc">✓ Seasonal backgrounds</text>
  <text x="180" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a5b4fc">✓ Customizable link groups</text>
  <text x="180" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a5b4fc">✓ Synced across devices</text>
</svg>
