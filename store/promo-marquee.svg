<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="560" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="1300" cy="100" r="200" fill="#4338ca" opacity="0.2"/>
  <circle cx="100" cy="460" r="150" fill="#4338ca" opacity="0.15"/>
  <circle cx="700" cy="500" r="100" fill="#4338ca" opacity="0.1"/>
  
  <!-- Icon - large -->
  <g transform="translate(150, 140) scale(2.2)">
    <!-- Cat ears -->
    <path d="M24 48 L36 20 L48 44" fill="url(#tabGrad)"/>
    <path d="M80 44 L92 20 L104 48" fill="url(#tabGrad)"/>
    
    <!-- Browser tab shape -->
    <path d="M20 48 L20 100 Q20 108 28 108 L100 108 Q108 108 108 100 L108 48 Q108 40 100 40 L28 40 Q20 40 20 48" fill="url(#tabGrad)"/>
    
    <!-- Inner ear detail -->
    <path d="M32 44 L36 28 L40 42" fill="#c4b5fd"/>
    <path d="M88 42 L92 28 L96 44" fill="#c4b5fd"/>
    
    <!-- Whiskers - left -->
    <line x1="8" y1="68" x2="28" y2="72" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="80" x2="26" y2="80" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="92" x2="28" y2="88" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Whiskers - right -->
    <line x1="100" y1="72" x2="120" y2="68" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="80" x2="122" y2="80" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="88" x2="120" y2="92" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Main text -->
  <text x="550" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="bold" fill="#ffffff">Tabby</text>
  <text x="550" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#c4b5fd">A beautiful, customizable new tab page</text>
  
  <!-- Feature boxes -->
  <g transform="translate(550, 340)">
    <rect x="0" y="0" width="240" height="80" rx="12" fill="#4338ca" opacity="0.4"/>
    <text x="120" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle">🌸 🌻 🍂 ❄️</text>
    <text x="120" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Seasonal Backgrounds</text>
  </g>
  
  <g transform="translate(810, 340)">
    <rect x="0" y="0" width="240" height="80" rx="12" fill="#4338ca" opacity="0.4"/>
    <text x="120" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle">🔗</text>
    <text x="120" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Custom Link Groups</text>
  </g>
  
  <g transform="translate(1070, 340)">
    <rect x="0" y="0" width="240" height="80" rx="12" fill="#4338ca" opacity="0.4"/>
    <text x="120" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#c4b5fd" text-anchor="middle">☁️</text>
    <text x="120" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Synced Across Devices</text>
  </g>
  
  <!-- Bottom tagline -->
  <text x="700" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#818cf8" text-anchor="middle">Make every new tab a pleasant experience</text>
</svg>
